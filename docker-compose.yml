services:
  cronbird:
    container_name: cronbird
    image: tinyops/cronbird:0.1.0
    restart: unless-stopped
    ports:
      - "18080:8080"
    env_file: .env
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
