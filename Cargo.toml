[package]
name = "cronbird"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'

[dependencies]
anyhow = "1.0.100"
thiserror = "2.0.17"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

tokio = { version = "1.49.0", features = ["full"] }
axum = { version = "0.8.8", features = ["json", "http1", "tokio"] }

log = "0.4.29"

[dev-dependencies]
env_logger = "0.11.8"
