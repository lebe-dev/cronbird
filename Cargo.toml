[package]
name = "cronbird"
version = "0.1.2"
edition = "2024"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'

[dependencies]
anyhow = "1.0.101"
thiserror = "2.0.18"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

tokio = { version = "1.49.0", features = ["full"] }
axum = { version = "0.8.8", features = ["json", "http1", "tokio", "macros"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace", "limit"] }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

dotenvy = "0.15"

[dev-dependencies]
env_logger = "0.11.8"
tempfile = "3"
